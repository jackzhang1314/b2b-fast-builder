# 声明式交互模板，不会凭空创建安全输入 UI。按宿主实际能力选择动作。
schemaVersion: 3

trigger:
  event: "current-step-needs-service-integration"
  doNotTriggerAtDesignStart: true
  requestOnlyCurrentlyNeededService: true
  # 样式确认先走 content-and-asset-handoff.md；本模板不是建站开场问卷。
  proactive: true
  waitForUserToAskForIntegrations: false
  stateFile: "./launch-state.yaml"
  resumeFromFirstUnverifiedStep: true
  verifyAfterUserAcknowledgement: true

capabilityFallbacks:
  noBrowser: "provide-official-link-and-one-step-instructions"
  noSecureSecretInput: "guide-user-to-provider-secret-dashboard"
  noShell: "use-authorized-connector-or-guided-dashboard"
  noInstallPermission: "report-limitation-without-bypassing-policy"

experience:
  audience: "non-technical"
  language: "plain"
  technicalDetailsHiddenByDefault: true
  statusLabels:
    working: "正在帮你配置"
    done: "已经完成"
    userAction: "现在需要你操作一下"
    externalWait: "正在等待平台生效"
    skipped: "已按你的选择跳过"
  oneActionPerRound: true
  doNotInventUi: true
  registrationRequiredForDesign: false

steps:
  - id: "basic-information"
    title: "补充当前上线或发信需要的信息"
    askOnlyFieldsRequiredForCurrentStep: true
    fields:
      - id: "domain"
        label: "你的网站域名是什么？"
        type: "text"
        secret: false
      - id: "registrar"
        label: "这个域名是在哪里买的？"
        type: "text-or-select"
        secret: false
      - id: "inquiryRecipient"
        label: "客户提交询盘后，邮件发到哪个邮箱？"
        type: "email"
        secret: false

  - id: "existing-services"
    title: "这个域名现在还在使用什么？"
    when: "dns-change-is-being-planned"
    fields:
      - id: "businessEmailInUse"
        label: "这个域名现在是否正在使用企业邮箱？"
        type: "yes-no-unknown"
        secret: false
      - id: "dnsEvidence"
        label: "如果方便，请上传原域名解析页面截图或导出文件"
        type: "file-or-image"
        required: false
        secret: false

  - id: "cloudflare-authorization"
    title: "连接 Cloudflare"
    when: "authorized-deploy-or-online-inquiry-test-or-selected-r2-upload"
    actions:
      - label: "打开 Cloudflare 注册或登录"
        type: "browser-open-or-link"
        url: "https://dash.cloudflare.com/"
        expectedReply: "已登录"
      - label: "允许当前工具配置网站"
        type: "oauth-or-scoped-secret"
        preferExistingAuthorization: true
        localMode: "wrangler-browser-oauth"
        remoteMode: "device-flow-if-supported"
        fallback: "provider-secret-or-authorized-connector"
        allowCredentialPaste: false
        expectedReply: "已授权"
    agentVerification: "whoami-and-target-account-permissions"

  - id: "nameserver-update"
    title: "让域名指向新网站"
    when: "dns-migration-is-required-and-approved"
    action:
      label: "打开域名购买平台的设置页面"
      type: "guided-user-action"
      showOnlyAssignedNameservers: true
      requireExplicitConfirmation: true
      expectedReply: "已修改"
    agentVerification: "dns-status-and-preserved-existing-services"

  - id: "resend-connection"
    title: "连接询盘邮件"
    when: "ready-to-connect-or-test-real-email"
    actions:
      - label: "打开 Resend 注册或登录"
        type: "browser-open-or-link"
        url: "https://resend.com/"
        expectedReply: "已注册"
      - label: "验证发信网址"
        type: "domain-connect-or-guided-dns"
        sendingOnly: true
        enableReceiving: false
        agentSuppliesSendingDomain: true
        expectedReply: "已授权"
    agentVerification: "resend-sending-domain-verified"

  - id: "resend-secret"
    title: "把邮件工具接到网站"
    when: "sending-domain-verified-and-secure-destination-ready"
    actions:
      - label: "创建邮件发送密钥"
        type: "guided-user-action"
        permission: "sending_access"
        restrictToVerifiedDomain: true
        requiresSecureDestinationReady: true
      - label: "粘贴邮件发送密钥"
        type: "secure-input-if-available-otherwise-provider-dashboard"
        destination: "cloudflare-pages-secret:RESEND_API_KEY"
        environment: "production"
        requireEncrypt: true
        masked: true
        visibleToConversation: false
        persistInLogs: false
        allowChatPaste: false
        expectedReply: "已保存"
    agentVerification: "secret-presence-environment-redeploy-and-test"

  - id: "live-chat"
    title: "要不要增加网站在线聊天？"
    when: "pages-ready-and-live-chat-integration-stage"
    askOnlyIfUndecided: true
    fields:
      - id: "liveChatProvider"
        label: "是否接入 Tidio 在线聊天？以后也可以补装"
        type: "select"
        options: ["暂不接入", "接入 Tidio"]
        secret: false
    conditionalActions:
      when: "liveChatProvider == 接入 Tidio"
      actions:
        - label: "打开 Tidio 注册或登录"
          type: "browser-open-or-link"
          url: "https://www.tidio.com/"
          expectedReply: "已注册"
        - label: "粘贴官方安装代码或 Public Key"
          type: "public-text-input"
          allowCredentialPaste: false
          rejectPrivateApiKey: true
    agentVerification: "static-loader-and-customer-inbox-round-trip"

  - id: "receipt-test"
    title: "确认客户的询盘真的能收到"
    when: "authorized-test-deployment-and-inquiry-services-configured"
    actions:
      - label: "请检查指定邮箱，包括垃圾邮件"
        type: "user-receipt-confirmation"
        expectedReply: "已收到"
      - label: "启用了聊天时，请在 Tidio Inbox 回复测试消息"
        type: "conditional-user-confirmation"
        when: "liveChatProvider == 接入 Tidio"
    agentVerification: "d1-record-email-id-receipt-thank-you-and-conversion"

automation:
  inferBeforeAsking: true
  maxQuestionsPerRound: 3
  previewDnsChangesBeforeWrite: true
  verifyExistingEmailAfterNameserverChange: true
  verifyInquiryEndToEnd: true
  installMissingRequiredToolsFromOfficialSources: true
  reuseExistingCompatibleTools: true
  installUnrelatedSkillsOrHooks: false
  automaticPaidUpgrade: false

forbiddenInputs:
  - "account_password"
  - "sms_code"
  - "two_factor_code"
  - "recovery_code"
  - "browser_cookie"
  - "secret_in_ordinary_chat"
  - "oauth_callback_or_access_token"
